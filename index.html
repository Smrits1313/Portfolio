<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aeon — Venture Past Our Sky</title>

    <!-- Tailwind (CDN, JIT in-browser) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              heading: ["'Instrument Serif'", "serif"],
              body: ["'Barlow'", "sans-serif"],
            },
            borderRadius: {
              // bare `rounded` => pill
              DEFAULT: "9999px",
            },
          },
        },
      };
    </script>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Barlow:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />

    <!-- Liquid-glass design system -->
    <style>
      html,
      body {
        background: #000;
        overflow-x: hidden;
      }
      body {
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
      ::selection {
        background: rgba(255, 255, 255, 0.2);
      }

      /* Subtle variant — nav / chips / cards */
      .liquid-glass {
        background: rgba(255, 255, 255, 0.01);
        background-blend-mode: luminosity;
        -webkit-backdrop-filter: blur(4px);
        backdrop-filter: blur(4px);
        border: none;
        box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.1);
        position: relative;
        overflow: hidden;
      }
      .liquid-glass::before {
        content: "";
        position: absolute;
        inset: 0;
        border-radius: inherit;
        padding: 1.4px;
        background: linear-gradient(
          180deg,
          rgba(255, 255, 255, 0.45) 0%,
          rgba(255, 255, 255, 0.15) 20%,
          rgba(255, 255, 255, 0) 40%,
          rgba(255, 255, 255, 0) 60%,
          rgba(255, 255, 255, 0.15) 80%,
          rgba(255, 255, 255, 0.45) 100%
        );
        -webkit-mask: linear-gradient(#fff 0 0) content-box,
          linear-gradient(#fff 0 0);
        mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
        -webkit-mask-composite: xor;
        mask-composite: exclude;
        pointer-events: none;
      }

      /* Heavier variant — primary CTA */
      .liquid-glass-strong {
        background: rgba(255, 255, 255, 0.01);
        background-blend-mode: luminosity;
        -webkit-backdrop-filter: blur(50px);
        backdrop-filter: blur(50px);
        border: none;
        box-shadow: 4px 4px 4px rgba(0, 0, 0, 0.05),
          inset 0 1px 1px rgba(255, 255, 255, 0.15);
        position: relative;
        overflow: hidden;
      }
      .liquid-glass-strong::before {
        content: "";
        position: absolute;
        inset: 0;
        border-radius: inherit;
        padding: 1.4px;
        background: linear-gradient(
          180deg,
          rgba(255, 255, 255, 0.5) 0%,
          rgba(255, 255, 255, 0.2) 20%,
          rgba(255, 255, 255, 0) 40%,
          rgba(255, 255, 255, 0) 60%,
          rgba(255, 255, 255, 0.2) 80%,
          rgba(255, 255, 255, 0.5) 100%
        );
        -webkit-mask: linear-gradient(#fff 0 0) content-box,
          linear-gradient(#fff 0 0);
        mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
        -webkit-mask-composite: xor;
        mask-composite: exclude;
        pointer-events: none;
      }
    </style>
  </head>

  <body class="bg-black font-body text-white">
    <div id="root"></div>

    <!-- React + Babel + Framer Motion (pinned, CDN-only) -->
    <script
      src="https://unpkg.com/react@18.3.1/umd/react.development.js"
      integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L"
      crossorigin="anonymous"
    ></script>
    <script
      src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js"
      integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm"
      crossorigin="anonymous"
    ></script>
    <script
      src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js"
      integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y"
      crossorigin="anonymous"
    ></script>
    <script src="https://unpkg.com/framer-motion@11.11.17/dist/framer-motion.js"></script>
    <script>
      window.Motion = window.FramerMotion;

      // Framer Motion / React dev list-key warnings are benign here — filter them.
      const __origError = console.error;
      console.error = function (...args) {
        const first = args[0];
        if (
          typeof first === "string" &&
          (first.includes("unique \"key\" prop") ||
            first.includes("unique key prop") ||
            first.includes("Each child in a list"))
        ) {
          return;
        }
        return __origError.apply(console, args);
      };
    </script>

    <!-- Site data (swap this file to change all copy / media) -->
    <script src="./js/content.js"></script>

    <!-- Components (loaded in dependency order; each exports via window.X = X) -->
    <script type="text/babel" src="./js/icons.babel.js"></script>
    <script type="text/babel" src="./js/FadingVideo.babel.js"></script>
    <script type="text/babel" src="./js/BlurText.babel.js"></script>
    <script type="text/babel" src="./js/Navbar.babel.js"></script>
    <script type="text/babel" src="./js/Hero.babel.js"></script>
    <script type="text/babel" src="./js/Capabilities.babel.js"></script>
    <script type="text/babel" src="./js/App.babel.js"></script>
  </body>
</html>
